# DNS do Docker: resolve os serviços em tempo de requisição,
# para o nginx iniciar mesmo que algum serviço ainda não esteja no ar
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----- API: manter o prefixo /api esperado pelos controllers Spring -----
    location ~ ^/api/auth/(.*)$ {
        rewrite ^/api/auth/(.*)$ /api/auth/$1 break;
        proxy_pass http://auth-service:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/api/(businesses|establishments|services)(/|$) {
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://business-service:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/api/(bookings|availability)(/|$) {
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://booking-service:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/api/(notifications|notification-templates)(/|$) {
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://notification-service:8080;
        include /etc/nginx/snippets/proxy.conf;
    }

    # /api/* sem serviço correspondente: 404, sem cair no index.html
    location /api/ {
        return 404;
    }

    # ----- Frontend (SPA estática) -----
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html sem cache para refletir novos deploys
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Fallback de SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
