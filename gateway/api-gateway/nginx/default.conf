resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    set $auth_upstream auth-service:8080;
    set $business_upstream business-service:8080;
    set $booking_upstream booking-service:8080;
    set $notification_upstream notification-service:8080;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/auth/ {
        proxy_pass http://$auth_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/businesses {
        proxy_pass http://$business_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/establishments {
        proxy_pass http://$business_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/services {
        proxy_pass http://$business_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/bookings {
        proxy_pass http://$booking_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/availability {
        proxy_pass http://$booking_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/notifications {
        proxy_pass http://$notification_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/notification-templates {
        proxy_pass http://$notification_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":{"message":"API route not found"}}';
    }

    # Frontend SPA.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
