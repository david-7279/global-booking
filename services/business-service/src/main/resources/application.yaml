spring:
  application:
    name: business-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_INTERNAL_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:global-booking}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:global-booking-auth-service}
    audience: ${JWT_AUDIENCE:global-booking-api}
  messaging:
    auth-events-queue: ${AUTH_EVENTS_QUEUE:business-service.auth-events}
    auth-events-dlq: ${AUTH_EVENTS_DLQ:business-service.auth-events.dlq}
    retry:
      max-attempts: ${BUSINESS_EVENT_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${BUSINESS_EVENT_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${BUSINESS_EVENT_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${BUSINESS_EVENT_RETRY_MAX_INTERVAL_MS:10000}
