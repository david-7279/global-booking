spring:
  application:
    name: auth-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_INTERNAL_PORT:5672}
    username: ${RABBITMQ_USERNAME:globalbooking}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:global-booking}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:global-booking-auth-service}
    audience: ${JWT_AUDIENCE:global-booking-api}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
