server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/global-booking-service-auth-db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTMyY2g=}

  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"