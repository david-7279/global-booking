spring:
  application:
    name: booking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_INTERNAL_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:global-booking}
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:global-booking-auth-service}
    audience: ${JWT_AUDIENCE:global-booking-api}
  catalog:
    base-url: ${BUSINESS_SERVICE_URL:http://business-service:8080}
    connect-timeout-ms: ${BUSINESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BUSINESS_READ_TIMEOUT_MS:3000}
  messaging:
    exchange: ${BOOKING_EVENTS_EXCHANGE:global-booking.events}
    outbox-delay-ms: ${BOOKING_OUTBOX_DELAY_MS:1000}
    max-attempts: ${BOOKING_OUTBOX_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${BOOKING_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${BOOKING_OUTBOX_MAX_BACKOFF_MS:10000}
