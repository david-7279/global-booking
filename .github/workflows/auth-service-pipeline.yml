name: Auth Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - services/auth-service/**
      - .github/workflows/auth-service-pipeline.yml
      - .github/workflows/backend-service-ci.yml
  push:
    branches: [main]
    paths:
      - services/auth-service/**
      - .github/workflows/auth-service-pipeline.yml
      - .github/workflows/backend-service-ci.yml

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: Auth Service
      working-directory: services/auth-service
    permissions:
      contents: read
