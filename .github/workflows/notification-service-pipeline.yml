name: Notification Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - services/notification-service/**
      - .github/workflows/notification-service-pipeline.yml
      - .github/workflows/backend-service-ci.yml
  push:
    branches: [main]
    paths:
      - services/notification-service/**
      - .github/workflows/notification-service-pipeline.yml
      - .github/workflows/backend-service-ci.yml

permissions:
  contents: read

concurrency:
  group: notification-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: Notification Service
      working-directory: services/notification-service
    permissions:
      contents: read
