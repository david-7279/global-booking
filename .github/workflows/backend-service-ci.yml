name: Reusable Backend Service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: Display name used in the workflow and artifact.
        required: true
        type: string
      working-directory:
        description: Service directory relative to the repository root.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: service_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-32
      JWT_ISSUER: global-booking-auth-service
      JWT_AUDIENCE: global-booking-api
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_INTERNAL_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d service_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      - name: Verify with Maven Wrapper
        working-directory: ${{ inputs.working-directory }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.service-name }}-test-reports
          path: |
            ${{ inputs.working-directory }}/target/surefire-reports/**
            ${{ inputs.working-directory }}/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
